[tools]
node = "26.7.0"
pnpm = "11.22.0"

[tasks."fmt:ts"]
description = "Format with oxfmt"
run = "pnpm exec oxfmt --write apps/tauri/src apps/tauri/vite.config.ts apps/mcp-app-viewer/src apps/mcp-app-viewer/vite.config.ts"

[tasks."lint:ts"]
description = "Lint, fmt check, type-check, and audit TypeScript"
run = [
  "pnpm exec oxlint -c oxlint.config.ts .",
  "pnpm exec oxfmt --check apps/tauri/src apps/tauri/vite.config.ts apps/mcp-app-viewer/src apps/mcp-app-viewer/vite.config.ts",
  "pnpm exec tsc --noEmit",
  "pnpm exec tsc --noEmit -p apps/tauri",
  "pnpm exec tsc --noEmit -p apps/mcp-app-viewer",
  "pnpm audit",
]

[tasks."lint:knip"]
description = "Detect unused files, dependencies, and exports with knip"
run = "pnpm exec knip"

[tasks."test:ts"]
description = "Run tests with vitest"
run = "pnpm exec vitest run"

[tasks."ci:ts"]
description = "Run TypeScript lint, type-check, and test tasks"
depends = ["lint:ts", "lint:knip", "test:ts"]
