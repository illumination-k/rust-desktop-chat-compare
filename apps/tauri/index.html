<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat (Tauri)</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <nav class="sidebar">
        <div class="toolbar">
          <button id="new-chat">+ New chat</button>
          <button id="open-settings" class="secondary">Settings</button>
        </div>
        <ul id="conversations"></ul>
      </nav>
      <main>
        <div id="error" class="error" hidden>
          <span id="error-text"></span>
          <button id="dismiss-error" class="link">✕</button>
        </div>
        <section id="chat-view" class="chat">
          <div id="empty" class="empty">Start a new conversation</div>
          <!-- column-reverse keeps the view pinned to the bottom while tokens stream in -->
          <div class="messages"><div id="messages" class="messages-inner"></div></div>
          <div class="composer">
            <textarea id="input" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
            <button id="send">Send</button>
            <button id="stop" class="danger" hidden>⏹ Stop</button>
          </div>
        </section>
        <form id="settings-view" class="settings" hidden>
          <h2>Settings</h2>
          <label for="provider">Provider</label>
          <select id="provider">
            <option value="anthropic">Anthropic</option>
            <option value="mock">Mock</option>
          </select>
          <label for="api-key">API key</label>
          <div>
            <input id="api-key" type="password" />
            <button id="remove-key" type="button" class="link" hidden>Remove saved key</button>
          </div>
          <label for="model">Model</label>
          <input id="model" />
          <label for="max-tokens">Max tokens</label>
          <input id="max-tokens" type="number" min="1" />
          <label for="system-prompt">System prompt</label>
          <textarea id="system-prompt" rows="6"></textarea>
          <div></div>
          <div class="actions">
            <button id="save-settings" type="submit">Save</button>
            <button id="cancel-settings" type="button" class="secondary">Cancel</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
