name: CI Rust

# Markdown/docs formatting is covered by the base lint workflows, so
# docs-only changes skip this workflow entirely.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  ci:
    # Deliberately NOT ubuntu-slim: cargo build/clippy are compute-bound, and
    # included-minute consumption is per wall-clock minute, so the slower
    # 1-vCPU slim image would eat more of the quota than it saves.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENV: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          # Avoid GitHub API rate limits for aqua and cargo-binstall
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Install GUI system dependencies
        run: scripts/install-linux-deps.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::warning::Cargo.lock is missing; generating one for this run. Commit Cargo.lock to pin dependencies."
            cargo generate-lockfile
          fi
          cargo build --locked --workspace --all-features

      - name: CI
        run: mise run ci:rust
