name: CI TypeScript

# Markdown/docs formatting is covered by the base lint workflows, so
# docs-only changes skip this workflow entirely.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  ci:
    # Node/bun and the package manager come from mise; oxlint/tsc/vitest on a
    # fresh repo are light, so the cheaper 1-vCPU slim image is enough.
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_ENV: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          # Avoid GitHub API rate limits for aqua-backed tools
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: "${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: "${{ runner.os }}-pnpm-"

      - name: Install dependencies
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::warning::pnpm-lock.yaml is missing; generating one for this run. Commit it to pin dependencies."
            pnpm install --lockfile-only
          fi
          pnpm install --frozen-lockfile

      - name: CI
        run: mise run ci:ts
