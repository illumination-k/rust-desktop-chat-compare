name: CI TypeScript

# Markdown/docs formatting is covered by the base lint workflows, so
# docs-only changes skip this workflow entirely.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  ci:
    # Node/bun and the package manager come from mise; oxlint/tsc/vitest on a
    # fresh repo are light, so the cheaper 1-vCPU slim image is enough.
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_ENV: ts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        env:
          # Avoid GitHub API rate limits for aqua-backed tools
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: "${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: "${{ runner.os }}-pnpm-"

      - name: Install dependencies
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::warning::pnpm-lock.yaml is missing; generating one for this run. Commit it to pin dependencies."
            pnpm install --lockfile-only
          fi
          pnpm install --frozen-lockfile

      - name: CI
        run: mise run ci:ts
